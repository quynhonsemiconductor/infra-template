# =============================================================================
# Dependabot is deliberately the dependency tool for this repo, unlike the rest
# of the org, which uses Renovate. Renovate has never processed this repository
# despite a valid renovate.json and an org-wide app install, so retiring
# Dependabot here would leave nothing running. Kept byte-identical to infra's
# copy: this repo is the TEMPLATE the live one is generated from, and the two
# drifting is how infra-template ended up behind on infra-plan.yml as well.
#
# GROUPS are the point of this file's current shape. Without them Dependabot
# opens one PR per dependency per week — the flood that left 31 stale PRs across
# this org before Renovate's grouping replaced it elsewhere. One PR per
# ecosystem per week is reviewable; nine are not.
#
# NO `reviewers:` KEY, deliberately. Both this repo and infra-template used to
# set one and it did nothing: the review requests on Dependabot PRs come from
# CODEOWNERS (@quynhonsemiconductor/platform-infra), which the ruleset enforces
# via require_code_owner_review. Verified by reading the actual requested
# reviewers on a live Dependabot PR — the configured user did not appear.
# This repo's value was worse than useless: it named the ORGANISATION, which is
# not a valid reviewer at all.
# =============================================================================
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "terraform"
    directories: ["/live/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform:
        patterns: ["*"]
    # NOTE, not endorsement: this blocks ALL hashicorp and cloudflare provider
    # updates, security releases included. That may be deliberate — providers are
    # pinned in .terraform.lock.hcl and moved on purpose — but it is a policy
    # worth re-deciding rather than inheriting silently.
    ignore:
      - dependency-name: "hashicorp/*"
      - dependency-name: "cloudflare/*"
