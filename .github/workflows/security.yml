# =============================================================================
# Security · Scan — IaC misconfig + committed-secret gate for the live stacks.
#
# The shared quynhonsemiconductor/ci security suite is app/container oriented (Semgrep
# TS/Node packs, Trivy image CVEs) and is the wrong tool for pure OpenTofu, so
# this repo runs the IaC-native pair instead:
#   • Checkov  — Terraform/OpenTofu misconfig scan over live/ (the composition
#                layer defines its own raw resources that the shared tf-modules
#                checkov gate never sees).
#   • Gitleaks — committed-secret scan (guards against a credential slipping
#                into a *.tfvars or backend config).
#
# Checkov is REPORT-ONLY for now (no baseline yet). Triage the first-run
# findings, add a modules-style .checkov.baseline, then flip soft_fail: false.
#
# actions-security (zizmor) is added regardless of the app-vs-IaC split above:
# it scans this repo's OWN .github/workflows/*.yml. Blocking — the initial
# rollout ran clean, no findings.
#
# NOTE: this is the template repo. The Checkov scan itself is no longer duplicated
# here — it comes from ci/actions/iac-checkov@v1, so the tool, its version and its
# flags stay in step with infra automatically. That is deliberate: the hand-written
# "keep this file in sync" instruction this line used to carry had already failed
# (this repo sat on checkov-action v12.3119.0 while infra moved to v12.3122.0).
# What still needs to match infra by hand is the surrounding job shape and the
# soft-fail decision.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC — catch new CVEs between pushes

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    # The job NAME is the required-check name on main (`checkov (IaC misconfig)`).
    # It must not change — hence a COMPOSITE action, not a reusable workflow,
    # whose check would report as `checkov / <inner>` and never fire again.
    name: checkov (IaC misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REPORT-ONLY, unchanged here on purpose: changing the implementation and
      # the enforcement together would make a red check ambiguous between "the
      # shared action differs" and "this repo has findings". Flip to
      # soft-fail 'false' with a live/.checkov.baseline once triaged.
      #
      # Adopting the shared action also closes a real drift: this repo was pinned
      # to checkov-action v12.3119.0 while infra had moved to v12.3122.0, which is
      # exactly what the header's "keep this file in sync with qnsc-infra"
      # instruction was supposed to prevent and did not.
      - uses: quynhonsemiconductor/ci/actions/iac-checkov@v1
        with:
          directory: live/
          soft-fail: 'true'

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/scan-secrets@v1

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true
