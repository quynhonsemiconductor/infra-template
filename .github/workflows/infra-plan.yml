# =============================================================================
# Infrastructure · Plan — dry-run on every PR targeting main. (OpenTofu under the hood.)
# Posts a plan comment per changed workspace directly on the PR.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  fmt:
    # The job NAME is a required-check name in scaffolded copies. It must not
    # change, which is why this is a COMPOSITE action rather than a reusable
    # workflow — a reusable reports as `fmt / <inner job>`, renaming the check.
    name: tofu fmt check
    # THE `if:` GUARD IS GONE, and that is a fix rather than a side effect. This
    # job was skipped in the template for one reason: it assumed
    # `__PRODUCT__-github-infra-plan` through setup-tofu-aws, and an unresolved
    # placeholder ARN can never assume. So the template repo has never
    # format-checked its own Terraform — the very files every scaffolded copy is
    # cloned from. iac-lint needs no cloud identity, so the credential, the
    # `id-token: write` and the skip all go together, and the template now gates
    # its own formatting like any other repo. Verified clean before enabling:
    # `tofu fmt -check -recursive` exits 0 on this tree today.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@v1
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'true'

  # tflint — NOT a required check, matching infra. Introduced here so scaffolded
  # copies inherit it; findings are unknown until it has run, so it reports under
  # its own name rather than gating anything. Needs no cloud identity either, so
  # it runs in the template too. `validate` stays off: these stacks have real
  # backends and validate belongs beside `tofu plan`.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/iac-lint@v1
        with:
          tofu-version: ${{ env.TOFU_VERSION }}
          fmt: 'false'
          tflint: 'true'
          dirs: 'live/*/'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.set.outputs.workspaces }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: set
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep '^live/' \
            | sed 's|/.*||' \
            | sort -u \
            | grep -v '^live$' \
            | jq -Rc '[.,inputs]' \
            | jq -sc 'add // []')
          # `grep -q` inside the `if`, not `grep -c` on its own line: GitHub's
          # default shell is `bash -e`, and grep exits 1 when it matches nothing
          # — which is the COMMON case here. As a bare command that aborts the
          # step; inside an `if` condition the non-zero status is the branch, not
          # a failure. The previous `grep | wc -l` was safe for the same reason a
          # pipeline's status is its LAST command's, but shellcheck flags it
          # (SC2126) and the naive fix is the one that breaks.
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^modules/'; then
            CHANGED='["live/_shared","live/develop","live/prod"]'
          fi
          echo "workspaces=$CHANGED" >> "$GITHUB_OUTPUT"

  plan:
    # The template repo keeps the unresolved `__PRODUCT__` placeholder role ARN, so OIDC
    # role assumption can never succeed here — infra-apply.yml already guards every job
    # this way and this one was missed, so the check has been failing on every PR that
    # touches a .tf file. Scaffolded copies have a different repository name and run
    # normally.
    #
    # Both conditions live in ONE `if:` — a second `if:` key on this job silently
    # overwrote the first (duplicate YAML mapping key), so the repository guard above
    # was never actually applied; only the workspaces check ran. zizmor's stricter
    # parser refuses to even load a workflow with a duplicate key, which is what
    # surfaced this on the actions-security rollout.
    needs: detect-changes
    if: github.repository != 'quynhonsemiconductor/infra-template' && needs.detect-changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write # Post plan comment

    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.detect-changes.outputs.workspaces) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@v1
        with:
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/__PRODUCT__-github-infra-plan
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: ${{ matrix.workspace }}
        run: tofu init -input=false

      - name: tofu validate
        working-directory: ${{ matrix.workspace }}
        run: tofu validate

      - name: tofu plan
        id: plan
        working-directory: ${{ matrix.workspace }}
        run: tofu plan -input=false -no-color 2>&1 | tee plan.txt
        env:
          TF_VAR_acm_cert_arn:     ${{ secrets.ACM_CERT_ARN }}
          TF_VAR_web_acm_cert_arn: ${{ secrets.WEB_ACM_CERT_ARN }}
          TF_VAR_image_tag:        ${{ vars.DEFAULT_IMAGE_TAG || 'latest' }}
        continue-on-error: true

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3   # v9.0.0
        env:
          WORKSPACE: ${{ matrix.workspace }}
        with:
          script: |
            const fs = require('fs');
            const workspace = process.env.WORKSPACE;
            const plan = fs.readFileSync(`${workspace}/plan.txt`, 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            const body = `### Infrastructure Plan — \`${workspace}\`\n\`\`\`hcl\n${truncated}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
